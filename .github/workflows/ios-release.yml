## Tally — iOS signed archive and App Store Connect upload
##
## PHASE 2 of the no-Mac pipeline. Produces a REAL SIGNED .ipa and can upload it
## to App Store Connect for TestFlight or submission.
##
## Put this file in the Tally-iOS repo at:  .github/workflows/ios-release.yml
##
## MANUAL TRIGGER ONLY. This deliberately does NOT run on push — you do not want
## an App Store upload every time a file changes. Run it from the Actions tab
## with "Run workflow", and tick "upload" only when you actually want the build
## to reach App Store Connect. Leaving it unticked archives and signs without
## uploading, which is the right way to test the signing half on its own.
##
## REQUIRED SECRETS (Settings > Secrets and variables > Actions):
##   APPSTORE_API_KEY_ID       — the Key ID, e.g. ABCD123456
##   APPSTORE_API_ISSUER_ID    — the Issuer ID (long UUID, shown above the table)
##   APPSTORE_API_PRIVATE_KEY  — the ENTIRE contents of the .p8 file,
##                               including the BEGIN and END lines
##
## Secrets are write-only: they never appear in logs and are not exposed to
## workflows triggered from forks, which is why a public repo is fine here.
##
## HOW SIGNING WORKS HERE — no .p12 and no provisioning profile needed. The
## project already uses CODE_SIGN_STYLE = Automatic, so xcodebuild is given the
## App Store Connect API key and -allowProvisioningUpdates, and it creates and
## downloads the distribution certificate and profile itself. One credential
## instead of three.

name: iOS release (signed archive + upload)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to App Store Connect (leave unticked to only archive and sign)"
        type: boolean
        default: false

env:
  XCODE_DIR: src
  WORKSPACE: Tally.xcworkspace
  SCHEME: Tally
  TEAM_ID: K3DM32S2MF
  BUNDLE_ID: io.github.tallytracker.tally

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: xcodebuild -version

      # xcodebuild and altool both expect the key at this exact path and
      # filename. Written from a secret, so it never touches the repo.
      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "Key installed (contents not printed)."

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.XCODE_DIR }}
        run: pod install --repo-update

      # WHY THE ARCHIVE IS UNSIGNED — three failed runs got us here:
      #   #1 no identity set: automatic signing asked Apple for an iOS App
      #      DEVELOPMENT profile and failed, "Your team has no devices from
      #      which to generate a provisioning profile".
      #   #2 CODE_SIGN_IDENTITY on the command line: applies to EVERY target,
      #      so all nine Pods targets plus Tally failed with "conflicting
      #      provisioning settings".
      #   #3 same identity set in the pbxproj Release config: Pods errors
      #      cleared, but Tally still conflicted — CODE_SIGN_STYLE = Automatic
      #      refuses ANY explicitly specified identity, wherever it is set.
      #
      # The real problem: xcodebuild ARCHIVE with automatic signing wants a
      # DEVELOPMENT profile, and development profiles require at least one
      # registered device. This account has none and does not need any.
      #
      # So: archive with CODE_SIGNING_ALLOWED=NO, and let -exportArchive do the
      # signing. Export requests an APP STORE DISTRIBUTION profile, which needs
      # no devices at all, and -allowProvisioningUpdates plus the API key lets
      # it create the certificate and profile on demand. The build number comes
      # from github.run_number so it always increases.
      # ATTEMPTED AND REJECTED (11 Aug 2026): ad-hoc signing the archive
      # (CODE_SIGN_IDENTITY="-") to get entitlements baked in. The iOS SDK
      # refuses it outright — "Ad Hoc code signing is not allowed with SDK
      # 'iOS 26.5'" — for the app target and all nine Pods targets. Do not retry.
      # The entitlements are restored by the re-sign step after export instead.
      #
      # ORIGINAL NOTE — WHY THE ARCHIVE IS UNSIGNED. Archiving with
      # CODE_SIGNING_ALLOWED=NO produced an archive with NO entitlements
      # baked in, and -exportArchive then signed it with only a minimal default
      # set. PROVEN by the entitlements dump on run #11: the shipped binary
      # carried application-identifier, beta-reports-active, team-identifier and
      # get-task-allow, and NOTHING ELSE — no com.apple.developer.applesignin
      # and no aps-environment, even though the provisioning profile grants
      # both. Sign in with Apple therefore failed at runtime with
      # ASAuthorizationError 1000, and push notifications could never have
      # worked on iOS either.
      #
      # Ad-hoc signing (CODE_SIGN_IDENTITY="-") needs no certificate and no
      # provisioning profile, so it keeps the no-Mac property that made
      # CODE_SIGNING_ALLOWED=NO attractive, but it DOES apply
      # CODE_SIGN_ENTITLEMENTS. -exportArchive then re-signs with the real
      # distribution certificate and preserves them.
      #
      # CODE_SIGN_STYLE=Manual is required: Automatic refuses any explicit
      # identity (that was failed run #3 on 10 Aug). The empty
      # PROVISIONING_PROFILE_SPECIFIER stops it looking for one it does not need.
      - name: Archive (unsigned — export signs it)
        working-directory: ${{ env.XCODE_DIR }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Tally.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Write ExportOptions.plist
        working-directory: ${{ env.XCODE_DIR }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          cat ExportOptions.plist

      # If this step fails complaining about the "method" value, the Xcode on
      # the runner is older than the app-store-connect rename: change
      # app-store-connect to app-store above and re-run.
      - name: Export signed .ipa
        working-directory: ${{ env.XCODE_DIR }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Tally.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Exported:"
          ls -lh build/export

      # RESTORE THE ENTITLEMENTS (11 Aug 2026). The archive is unsigned, so
      # -exportArchive signs the app with a MINIMAL default set and silently
      # drops everything in Entitlements.plist. Run #11 proved it: the shipped
      # binary carried no com.apple.developer.applesignin and no
      # aps-environment, which is why Sign in with Apple failed with
      # ASAuthorizationError 1000 and why iOS push could never have worked.
      #
      # Ad-hoc signing the archive would have been the tidy fix but the iOS SDK
      # forbids it, so instead the exported app is re-signed here with the real
      # distribution identity AND the real entitlements file. The identity is
      # already in the keychain at this point: cloud signing put it there during
      # export.
      #
      # --generate-entitlement-der is required on modern iOS: the store rejects
      # binaries whose DER entitlements are missing or stale.
      #
      # WHY THIS STEP IS WRITTEN THE WAY IT IS (13 Aug 2026). Run #13 failed
      # after ONE SECOND having printed nothing but the IPA path, which told us
      # almost nothing. Cause: the step ran under `set -euo pipefail`, and
      #     IDENTITY=$(security find-identity ... | grep -o ...)
      # aborts the whole step the moment grep matches nothing — BEFORE reaching
      # the `if [ -z "$IDENTITY" ]` guard that was supposed to report exactly
      # that. `set -e` and a guard clause are mutually exclusive; the guard
      # never runs. So: `-e` is deliberately OFF here and every stage checks
      # itself and says what it found. RULE FOR THIS STEP — never reintroduce
      # `set -e`; a diagnostic step that dies silently is worse than no step.
      #
      # The keychain dump is printed FIRST, unconditionally, before anything can
      # fail. Whether cloud signing actually leaves a usable identity behind is
      # the open question this step exists to answer, so that evidence must
      # survive any later failure.
      - name: Re-sign the app with its real entitlements
        working-directory: ${{ env.XCODE_DIR }}
        run: |
          set -uo pipefail   # NOT -e. See the note above; the guards need to run.
          SRC="$PWD"

          echo "===== KEYCHAIN SEARCH LIST ====="
          security list-keychains -d user 2>&1 || true
          echo "===== VALID CODESIGNING IDENTITIES ====="
          security find-identity -v -p codesigning 2>&1 || true
          echo "===== ALL CODESIGNING IDENTITIES (incl. invalid) ====="
          security find-identity -p codesigning 2>&1 || true
          echo "========================================================"

          IPA=$(find "$SRC/build/export" -name '*.ipa' -print -quit)
          if [ -z "${IPA:-}" ]; then
            echo "FATAL: no .ipa under build/export."
            ls -lR "$SRC/build/export" 2>&1 | head -50
            exit 1
          fi
          echo "IPA: $IPA"

          ENTS="$SRC/Tally/Entitlements/Entitlements.plist"
          if [ ! -f "$ENTS" ]; then
            echo "Entitlements.plist not at the expected path — searching."
            ENTS=$(find "$SRC" -name 'Entitlements.plist' -not -path '*/Pods/*' -print -quit)
          fi
          if [ -z "${ENTS:-}" ] || [ ! -f "$ENTS" ]; then
            echo "FATAL: could not locate Entitlements.plist."
            find "$SRC" \( -name '*.entitlements' -o -name 'Entitlements.plist' \) 2>&1 | head -20
            exit 1
          fi
          echo "Entitlements file: $ENTS"
          echo "----- contents being applied -----"
          cat "$ENTS"
          echo "----------------------------------"

          WORK=/tmp/resign
          rm -rf "$WORK"; mkdir -p "$WORK"
          if ! unzip -q "$IPA" -d "$WORK"; then
            echo "FATAL: could not unzip the .ipa."
            exit 1
          fi
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "${APP:-}" ]; then
            echo "FATAL: no .app inside Payload."
            ls -lR "$WORK" 2>&1 | head -50
            exit 1
          fi
          echo "APP: $APP"

          # Three ways to name the identity, cheapest first. The last one uses
          # the SHA-1 hash, which works even when the certificate's common name
          # is not one we anticipated.
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep -o '"Apple Distribution[^"]*"' | head -1 | tr -d '"')
          if [ -z "${IDENTITY:-}" ]; then
            IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
              | grep -o '"iPhone Distribution[^"]*"' | head -1 | tr -d '"')
          fi
          if [ -z "${IDENTITY:-}" ]; then
            IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
              | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
            [ -n "${IDENTITY:-}" ] && echo "No distribution name matched; using identity hash $IDENTITY"
          fi
          if [ -z "${IDENTITY:-}" ]; then
            echo "FATAL: no codesigning identity in any keychain — cloud signing"
            echo "did not leave one behind, so re-signing here is impossible."
            echo "Fall back to registering a device and signing at archive time."
            exit 1
          fi
          echo "Re-signing with: $IDENTITY"

          if ! codesign --force --sign "$IDENTITY" \
                 --entitlements "$ENTS" \
                 --generate-entitlement-der \
                 "$APP"; then
            echo "FATAL: codesign failed."
            exit 1
          fi

          echo "===== ENTITLEMENTS ON THE FRESHLY RE-SIGNED .app ====="
          codesign -d --entitlements :- "$APP" 2>&1
          echo "======================================================"

          rm -f "$IPA"
          if ! (cd "$WORK" && zip -qry "$IPA" Payload); then
            echo "FATAL: could not repack the .ipa."
            exit 1
          fi
          echo "Re-signed and repacked: $IPA"

      # DIAGNOSTIC (11 Aug 2026) — prove what entitlements the SIGNED binary
      # actually carries. The archive is built with CODE_SIGNING_ALLOWED=NO and
      # signed later at export, so there is a real question over whether
      # Entitlements.plist survives that route. Sign in with Apple failing at
      # runtime with ASAuthorizationError 1000 ("unknown") is exactly what a
      # missing com.apple.developer.applesignin entitlement looks like, and
      # aps-environment has never been verified on iOS either. Cheap to keep.
      - name: Show the signed app's entitlements
        working-directory: ${{ env.XCODE_DIR }}
        run: |
          set +e
          IPA=$(find build/export -name "*.ipa" -print -quit)
          echo "IPA: $IPA"
          rm -rf /tmp/entcheck && mkdir -p /tmp/entcheck
          unzip -q "$IPA" -d /tmp/entcheck
          APP=$(find /tmp/entcheck/Payload -maxdepth 1 -name "*.app" -print -quit)
          echo "APP: $APP"
          echo "===== ENTITLEMENTS EMBEDDED IN THE SIGNED BINARY ====="
          codesign -d --entitlements :- "$APP" 2>&1
          echo "===== PROFILE ENTITLEMENTS ====="
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract Entitlements xml1 -o - - 2>&1
          echo "====================================================="

      - name: Upload the .ipa as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tally-ipa
          path: ${{ env.XCODE_DIR }}/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      # Only runs when the "upload" box was ticked at trigger time.
      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        working-directory: ${{ env.XCODE_DIR }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find build/export -name "*.ipa" -print -quit)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Summary
        run: |
          echo "### iOS release run complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded to App Store Connect: ${{ inputs.upload }}" >> $GITHUB_STEP_SUMMARY
          echo "- The signed .ipa is attached to this run as an artifact." >> $GITHUB_STEP_SUMMARY
